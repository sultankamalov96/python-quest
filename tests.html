  } },
  { name: 'датчик возвращает True/False', fn() {
      let x = 0;
      const r = Py.run('while not wall_ahead():\n    forward()\nprint(x())', { builtins: { wall_ahead: () => x >= 4, forward() { x++; }, x: () => x } });

  } },
  { name: 'ошибка из функции игры с номером строки', fn() {
      const r = Py.run('forward()\nforward()', { builtins: { forward() { throw new Error('Робот врезался в стену!'); } } });

      for (const s of Py.steps('x = 1\nfor i in range(2):\n    x += i\nprint(x)')) lines.push(s.line);

      for (const s of Py.steps('s = 0\nfor i in range(3):\n    s += i')) snaps.push(s.vars);

  { name: 'пошаговый режим: вывод на шаге', fn() {

// ------------------------------------------------------------------ запуск
const sections = [];

function section(title) {
  const s = { title, items: [] };
  sections.push(s);
  return s;
}

function runEngineTests() {
  const s = section('Интерпретатор: выполнение и ошибки (' + ENGINE_TESTS.length + ')');
  for (const t of ENGINE_TESTS) {
    const r = Py.run(t.code, { inputs: t.inputs || [] });
    let ok, detail;
    if (t.err) {
      ok = !r.ok && r.error.includes(t.err);
      detail = 'Ожидалась ошибка: ' + t.err + '\nПолучено: ' + (r.error || 'без ошибки, вывод: ' + JSON.stringify(r.output));
    } else {
      ok = r.ok && r.output === t.out;
      detail = 'Ожидалось: ' + JSON.stringify(t.out) + '\nПолучено: ' + (r.ok ? JSON.stringify(r.output) : r.error);
    }
    s.items.push({ name: t.name, ok, code: t.code, detail });
  }
  const a = section('Интерпретатор: API для игр (' + API_TESTS.length + ')');
  for (const t of API_TESTS) {
    let ok = false, detail = '';
    try { ok = !!t.fn(); } catch (e) { detail = String(e && e.stack || e); }
    a.items.push({ name: t.name, ok, detail });
  }
}

// Проверки задач и уровней: каждая функция получает section(title) и добавляет результаты
const DATA_CHECKS = [checkTasks, checkRobot, checkTrueFalse, checkCount, checkTurtle, checkTracer, checkMemory, checkQuiz, checkDuel, checkMines, checkBazaar];

function checkTrueFalse(section) {
  const s = section('Истина или Ложь: генератор условий');
  for (let stage = 0; stage <= 3; stage++) {
    let trues = 0, errs = [];
    const sample = [];
    for (let k = 0; k < 400; k++) {
      try {
        const q = TrueFalseGen.gen(stage);
        if (q.answer !== Py.truthy(Py.evalExpr(q.expr, q.vars))) errs.push('ответ не совпадает: ' + q.expr);
        if (q.answer) trues++;
        if (k < 4) sample.push(JSON.stringify(q.vars) + '  ' + q.expr + '  →  ' + q.explain);
      } catch (e) { errs.push(String(e.message || e)); }
    }
    const share = trues / 400;
    if (share < 0.35 || share > 0.65) errs.push('доля True ' + share.toFixed(2) + ' — нужно примерно поровну');
    s.items.push({ name: 'Этап ' + stage + ': 400 условий, True ' + Math.round(share * 100) + '%', ok: !errs.length, detail: errs.slice(0, 3).concat(sample).join('\n') });
  }
}

function checkCount(section) {
  const s = section('Сколько раз?: генератор вопросов');
  for (let q = 0; q < 10; q++) {
    const errs = [], kinds = { count: 0, last: 0 }, sample = [];
    for (let k = 0; k < 150; k++) {
      try {
        const g = CountGen.gen(q);
        const r = Py.run(g.code);
        const lines = r.output.replace(/\n$/, '').split('\n');
        const expect = g.kind === 'count' ? String(lines.length) : lines[lines.length - 1];
        if (!r.ok || expect !== g.answer) errs.push('неверный ответ для\n' + g.code);
        kinds[g.kind]++;
        if (k < 2) sample.push(g.code + '\n→ ' + g.question + ' ' + g.answer);
      } catch (e) { errs.push(String(e.message || e)); }
    }
    s.items.push({ name: 'Вопрос ' + (q + 1) + ' (уровень ' + CountGen.levelFor(q) + '): 150 генераций, «сколько» ' + kinds.count + ' / «последнее» ' + kinds.last, ok: !errs.length && kinds.count > 0, detail: errs.slice(0, 2).concat(sample).join('\n\n') });
  }
}

function checkTurtle(section) {
  const L = LEVELS.turtle || [];
  const s = section('Черепашка: уровни (' + L.length + ', нужно 15)');
  s.items.push({ name: 'количество уровней = 15', ok: L.length === 15 });
  L.forEach((lv, i) => {
    const errs = [], info = [];
    const st = TurtleSim.levelStart(lv);
    const r = TurtleSim.execute(lv.solution, st);
    if (r.error) errs.push('эталон падает: ' + r.error.message);
    const b = TurtleSim.bbox(r.T.segs);
    info.push('отрезков: ' + r.T.segs.length + ', рамка ' + Math.round(b.x2 - b.x1) + '×' + Math.round(b.y2 - b.y1));
    if (b.x1 < -195 || b.x2 > 195 || b.y1 < -195 || b.y2 > 195) errs.push('рисунок не помещается на холст 400×400');
    if (TurtleSim.countLines(lv.solution) > lv.maxLines) errs.push('эталон длиннее maxLines');
    if (!TurtleSim.compare(r.T.segs, r.T.segs, { colors: lv.colors }).ok) errs.push('эталон не совпадает сам с собой');
    // неверный рисунок не должен засчитываться: убираем заметный (от 20 шагов) отрезок без дубля
    const same = (a, b) => Math.hypot(a.x1 - b.x1, a.y1 - b.y1) + Math.hypot(a.x2 - b.x2, a.y2 - b.y2) < 1 || Math.hypot(a.x1 - b.x2, a.y1 - b.y2) + Math.hypot(a.x2 - b.x1, a.y2 - b.y1) < 1;
    const k = r.T.segs.findIndex((x, j) => Math.hypot(x.x2 - x.x1, x.y2 - x.y1) >= 20 && !r.T.segs.some((y, m) => m !== j && same(x, y)));
    if (k >= 0 && r.T.segs.length > 1 && TurtleSim.compare(r.T.segs.filter((_, j) => j !== k), r.T.segs, { colors: lv.colors }).ok) errs.push('проверка засчитала рисунок без отрезка №' + (k + 1));
    s.items.push({ name: (i + 1) + '. ' + lv.title, ok: !errs.length, code: lv.solution, detail: errs.concat(info).join('\n') });
  });
  // сравнение не зависит от того, как разбиты линии
  const split = TurtleSim.execute('forward(50)\nforward(50)').T.segs, whole = TurtleSim.execute('forward(100)').T.segs;
  s.items.push({ name: 'forward(50) два раза = forward(100)', ok: TurtleSim.compare(split, whole).ok });
  const red = TurtleSim.execute('color("red")\nforward(100)').T.segs;
  s.items.push({ name: 'цвет проверяется, если colors: true', ok: !TurtleSim.compare(whole, red, { colors: true }).ok && TurtleSim.compare(whole, red).ok });
  s.items.push({ name: 'другой угол квадрата не засчитывается', ok: !TurtleSim.compare(TurtleSim.execute('for i in range(4):\n    forward(100)\n    right(90)').T.segs, TurtleSim.execute('for i in range(4):\n    forward(100)\n    left(90)').T.segs).ok });
}

function checkMemory(section) {
  const s = section('Мемори: генератор пар');
  for (const set of MemoryGen.SETS) for (const n of [6, 8]) {
    const errs = [];
    let sample = '';
    for (let k = 0; k < 60; k++) {
      const ps = MemoryGen.pairs(set, n);
      if (ps.length !== n) { errs.push('получено пар: ' + ps.length + ' из ' + n); break; }
      if (new Set(ps.map(p => p.b)).size !== n || new Set(ps.map(p => p.a)).size !== n) errs.push('повторяются карточки');
      if (k === 0) sample = ps.map(p => p.a.replace(/\n/g, ' ⏎ ') + '  ↔  ' + p.b).join('\n');
    }
    s.items.push({ name: set + ': ' + n + ' пар × 60 раздач', ok: !errs.length, detail: errs.slice(0, 2).concat([sample]).join('\n') });
  }
  // равносильность пар в наборе «Логика» на x от -20 до 20
  const bad = MemoryGen.LOGIC.filter(([a, b, eq]) => {
    for (let x = -20; x <= 20; x++) if (Py.truthy(Py.evalExpr(a, { x })) !== Py.truthy(Py.evalExpr(eq || b, { x }))) return true;
    return false;
  });
  s.items.push({ name: 'Логика: все ' + MemoryGen.LOGIC.length + ' пар действительно равносильны', ok: !bad.length, detail: bad.map(p => p[0] + ' ≠ ' + p[1]).join('\n') });
}

function checkQuiz(section) {
  const s = section('Викторина: банк вопросов (' + QUIZ.length + ', нужно 45+)');
  s.items.push({ name: 'вопросов не меньше 45', ok: QUIZ.length >= 45 });
  for (let tier = 1; tier <= 5; tier++) {
    const n = QUIZ.filter(q => q.tier === tier).length;
    s.items.push({ name: 'уровень ' + tier + ': ' + n + ' вопросов (нужно ≥ 3, чтобы собрать игру)', ok: n >= 3 });
  }
  let auto = 0;
  QUIZ.forEach((q, i) => {
    const errs = [];
    if (!q.q || !q.explain || q.options.length !== 4 || !(q.answer >= 0 && q.answer < 4)) errs.push('нужны q, explain, 4 варианта и answer 0..3');
    if (new Set(q.options).size !== 4) errs.push('варианты повторяются');
    if (q.code) {
      const r = Py.run(q.code, { inputs: q.inputs || [] });
      if (!r.ok) errs.push('код падает: ' + r.error);
      if (q.check) {
        auto++;
        const lines = r.output.replace(/\n$/, '').split('\n');
        const got = q.check === 'count' ? String(lines.length) : r.output.trim().split(/\s+/).join(' ');
        if (got !== q.options[q.answer]) errs.push('верный вариант «' + q.options[q.answer] + '», а интерпретатор даёт «' + got + '»');
        q.options.forEach((o, k) => { if (k !== q.answer && o === got) errs.push('неверный вариант совпадает с ответом: ' + o); });
      }
    }
    s.items.push({ name: (i + 1) + '. [ур. ' + q.tier + '] ' + q.q + (q.check ? ' ✓ интерпретатор' : ''), ok: !errs.length, code: q.code, detail: errs.join('\n') });
  });
  s.title += ' — проверено интерпретатором: ' + auto;
  // выбор 15 вопросов: варианты перемешиваются, верный ответ сохраняется
  let okPick = true;
  for (let k = 0; k < 30; k++) {
    const qs = QuizGame.pick(QUIZ);
    if (qs.length !== 15) okPick = false;
    qs.forEach((q, i) => {
      const orig = QUIZ.find(x => x.q === q.q && x.code === q.code);
      if (q.tier !== Math.floor(i / 3) + 1 || q.options[q.answer] !== orig.options[orig.answer]) okPick = false;
    });
  }
  s.items.push({ name: 'игра: 15 вопросов по нарастающей, перемешанные варианты сохраняют верный ответ', ok: okPick });
}

function checkDuel(section) {
  const s = section('Дуэль: генератор заданий');
  for (const ty of Object.keys(DuelGen.MAKERS)) {
    const errs = [];
    let sample = '';
    for (let k = 0; k < 80; k++) {
      const q = DuelGen.MAKERS[ty](new Set());
      if (!q) { errs.push('не удалось создать задание'); break; }
      if (q.options.length < 2 || q.options.length > 4) errs.push('вариантов ' + q.options.length);
      if (new Set(q.options).size !== q.options.length) errs.push('варианты повторяются: ' + q.options.join(' | '));
      if (!(q.answer >= 0 && q.answer < q.options.length)) errs.push('нет верного ответа');
      // перепроверяем ответ интерпретатором
      if (ty === 'tf' || ty === 'output') {
        const r = Py.run(q.code);
        const got = r.output.trim().split(/\s+/).join(' ');
        if (got !== q.options[q.answer]) errs.push('ответ «' + q.options[q.answer] + '», а программа выводит «' + got + '»');
      }
      if (ty === 'count') {
        const lines = Py.run(q.code).output.replace(/\n$/, '').split('\n');
        const right = q.title.includes('последним') ? lines[lines.length - 1] : String(lines.length);
        if (right !== q.options[q.answer]) errs.push('ответ «' + q.options[q.answer] + '», а должно быть «' + right + '»');
      }
      if (k === 0) sample = q.title + '\n' + q.code + '\n' + q.options.map((o, i) => (i === q.answer ? '✔ ' : '  ') + o).join('\n');
    }
    s.items.push({ name: ty + ': 80 заданий', ok: !errs.length, detail: errs.slice(0, 3).concat([sample]).join('\n') });
  }
  const used = new Set(), keys = [];
  for (let i = 0; i < 10; i++) keys.push(DuelGen.round(i, used).key);
  s.items.push({ name: '10 раундов дуэли без повторов', ok: new Set(keys).size === 10 });
}

function checkMines(section) {
  const L = LEVELS.minesweeper || [];
  const s = section('Сапёр: уровни (' + L.length + ', нужно 12)');
  s.items.push({ name: 'количество уровней = 12', ok: L.length === 12 });
  L.forEach((lv, i) => {
    const errs = [], info = [];
    const syn = Py.check('mine = False\n' + lv.rule);
    if (syn) errs.push('ошибка в правиле: ' + syn.msg);
    else {
      let minM = 99, maxM = 0;
      for (let k = 0; k < 20; k++) {
        const cells = MineSim.board(lv);
        const m = cells.filter(c => c.mine).length;
        minM = Math.min(minM, m); maxM = Math.max(maxM, m);
        // правило, выполненное интерпретатором, совпадает с условием из объяснения (для правил в одну строку)
        if (!lv.rule.includes('else') && lv.rule.split('\n').filter(l => /^\s*if/.test(l)).length === 1) {
          const cond = lv.rule.match(/if\s+(.+):/)[1];
          cells.forEach(c => { if (Py.truthy(Py.evalExpr(cond, { n: c.n, row: c.row, col: c.col })) !== c.mine) errs.push('несовпадение в клетке ' + JSON.stringify(c)); });
        }
      }
      info.push('мин на поле: от ' + minM + ' до ' + maxM + ' (20 случайных полей)');
      if (minM < 5 || maxM > 22) errs.push('плотность мин вне 5…22');
      info.push('объяснение для n = 21, row = 3, col = 1:\n' + MineSim.explain(lv, { n: 21, row: 3, col: 1 }).join('\n'));
    }
    s.items.push({ name: (i + 1) + '. ' + lv.title, ok: !errs.length, code: lv.rule, detail: errs.slice(0, 3).concat(info).join('\n') });
  });
  s.items.push({ name: 'разбор условия по and/or вне скобок', ok: JSON.stringify(MineSim.parts('row > col and (n % 2 == 0 or n > 25)')) === JSON.stringify(['row > col', '(n % 2 == 0 or n > 25)']) });
}

function checkBazaar(section) {
  const L = LEVELS.bazaar || [];
  const s = section('Магазин: уровни (' + L.length + ', нужно 8)');
  s.items.push({ name: 'количество уровней = 8', ok: L.length === 8 });
  L.forEach((lv, i) => {
    const errs = [], info = [];
    const outs = new Set();
    let edgeSeen = !lv.edges;
    for (let k = 0; k < 30; k++) {
      const list = BazaarSim.customers(lv);
      if (list.length !== 10) errs.push('покупателей не 10');
      list.forEach(v => {
        const r = BazaarSim.serve(lv.solution, v);
        if (!r.ok) errs.push('эталон падает на ' + JSON.stringify(v) + ': ' + r.error);
        else if (!r.output.trim()) errs.push('эталон ничего не вывел');
        outs.add(r.output);
        if (lv.edges && Object.keys(lv.edges).some(key => lv.edges[key].includes(v[key]))) edgeSeen = true;
      });
      if (k === 0) info.push(list.slice(0, 3).map(v => JSON.stringify(v) + ' → ' + JSON.stringify(BazaarSim.serve(lv.solution, v).output)).join('\n'));
    }
    if (!edgeSeen) errs.push('пограничные значения не попадаются');
    // неверная программа (просто печатает что-то не то) не должна пройти всех покупателей
    const wrong = BazaarSim.customers(lv).every(v => BazaarSim.check(lv, 'print(0)', v).ok);
    if (wrong) errs.push('программа print(0) проходит всех — уровень слишком слабый');
    // эталон проходит сам себя
    if (!BazaarSim.customers(lv).every(v => BazaarSim.check(lv, lv.solution, v).ok)) errs.push('эталон не проходит проверку');
    s.items.push({ name: (i + 1) + '. ' + lv.title + ' — разных чеков: ' + outs.size, ok: !errs.length, code: lv.solution, detail: errs.slice(0, 3).concat(info).join('\n') });
  });
}

function checkRobot(section) {
  const L = LEVELS.robot || [];
  const s = section('Робот: уровни (' + L.length + ', нужно 20)');
  s.items.push({ name: 'количество уровней = 20', ok: L.length === 20 });
  L.forEach((lv, i) => {
    const errs = [], info = [];
    if (!lv.random) {
      const okMap = lv.map.length === 8 && lv.map.every(r => r.length === 8 && /^[#.R$OF]+$/.test(r));
      if (!okMap) errs.push('карта должна быть 8×8 из символов # . R $ O F');
      if (lv.map.join('').split('R').length !== 2) errs.push('на карте должен быть ровно один робот R');
      const r = RobotSim.run(lv, lv.solution);
      if (!r.win) errs.push('эталон не доходит до финиша: ' + (r.error || 'программа закончилась раньше'));
      else if (r.stars !== 3) errs.push('эталон получает ' + r.stars + ' звезды вместо 3 (строк: ' + RobotSim.countLines(lv.solution) + ', монет ' + r.world.taken + '/' + r.world.coins + ')');
    } else {
      let wins = 0;
      const maps = new Set();
      for (let seed = 1; seed <= 50; seed++) {
        const r = RobotSim.run(lv, lv.solution, seed);
        maps.add(r.map.join('/'));
        if (r.win && r.stars === 3) wins++;
        else if (errs.length < 3) errs.push('зерно ' + seed + ': ' + (r.error || 'не дошёл / не 3 звезды') + '\n' + r.map.join('\n'));
      }
      info.push('эталон прошёл ' + wins + ' из 50 случайных карт; разных карт: ' + maps.size);
      if (maps.size < 20) errs.push('слишком мало разных карт: ' + maps.size);
    }
    s.items.push({ name: (i + 1) + '. ' + lv.title, ok: !errs.length, code: lv.solution, detail: errs.concat(info).join('\n') });
  });
}

function checkTasks(section) {
  const s = section('Задачи-пазлы (' + TASKS.length + ', нужно 60+)');
  s.items.push({ name: 'задач не меньше 60', ok: TASKS.length >= 60 });
  const ids = new Set();
  const ok = (cond, msg, errs) => { if (!cond) errs.push(msg); };
  const runAll = (code, tests) => (tests && tests.length ? tests : [{ inputs: [] }]).map(tc => ({ tc, r: Py.run(code, { inputs: tc.inputs || [] }) }));
  const flat = out => out.trim().split(/\s+/).join(' ');

  for (const task of TASKS) {
    const errs = [], info = [];
    const d = task.data || {};
    ok(task.id && !ids.has(task.id), 'id пустой или повторяется', errs);
    ids.add(task.id);
    ok(['parsons', 'blanks', 'output', 'bug', 'maze', 'match', 'flow'].includes(task.type), 'неизвестный type', errs);
    ok(task.topic >= 1 && task.topic <= 8, 'topic должен быть 1..8', errs);
    ok(task.level >= 1 && task.level <= 3, 'level должен быть 1..3', errs);
    ok(task.title && task.story && task.explain, 'нужны title, story, explain', errs);
    ok(Array.isArray(task.hints) && task.hints.length === 2, 'нужно ровно 2 подсказки', errs);

    try {
      switch (task.type) {
        case 'output': {
          const r = Py.run(task.code, { inputs: task.inputs || [] });
          ok(r.ok, 'код падает: ' + r.error, errs);
          ok(r.output.trim() !== '', 'программа ничего не выводит', errs);
          info.push('Ответ: ' + JSON.stringify(r.output));
          break;
        }
        case 'parsons':
        case 'flow': {
          const code = d.lines.join('\n');
          for (const { tc, r } of runAll(code, d.tests)) {
            ok(r.ok, 'эталон падает на ' + JSON.stringify(tc.inputs) + ': ' + r.error, errs);
            info.push(JSON.stringify(tc.inputs || []) + ' → ' + JSON.stringify(r.output));
          }
          const trimmed = d.lines.map(l => l.trim());
          (d.distractors || []).forEach(x => ok(!trimmed.includes(x.trim()), 'ловушка совпадает с настоящей строкой: ' + x, errs));
          if (task.type === 'flow') ok(Array.isArray(d.chart) && Flowchart.svg(d.chart).includes('<svg'), 'нет блок-схемы', errs);
          break;
        }
        case 'blanks': {
          const slots = Array.from(new Set((task.code.match(/___(\d+)___/g) || []).map(m => m.match(/\d+/)[0])));
          ok(slots.length > 0, 'в коде нет пропусков', errs);
          slots.forEach(n => ok(d.answers[n] && d.answers[n].length, 'нет ответа для пропуска ' + n, errs));
          const need = {};
          slots.forEach(n => { const a = d.answers[n][0]; need[a] = (need[a] || 0) + 1; });
          Object.keys(need).forEach(a => ok(d.bank.filter(x => x === a).length >= need[a], 'в банке не хватает плитки «' + a + '»', errs));
          ok(d.bank.length > slots.length, 'в банке должны быть лишние плитки', errs);
          const filled = task.code.replace(/___(\d+)___/g, (m, n) => d.answers[n][0]);
          const syn = Py.check(filled);
          ok(!syn, 'заполненный код с ошибкой: ' + (syn && syn.msg), errs);
          info.push(filled);
          break;
        }
        case 'bug': {
          const lines = task.code.split('\n');
          ok(d.line >= 1 && d.line <= lines.length, 'неверный номер строки бага', errs);
          ok(d.fixes.length >= 3 && d.fixes.length <= 4, 'нужно 3–4 варианта исправления', errs);
          const fix = f => (d.raw || /^\s/.test(f) ? f : lines[d.line - 1].match(/^\s*/)[0] + f);
          const fixed = lines.map((l, i) => (i === d.line - 1 ? fix(d.fixes[d.correct]) : l)).join('\n');
          let differs = false;
          for (const tc of d.tests && d.tests.length ? d.tests : [{ inputs: [] }]) {
            const a = Py.run(task.code, { inputs: tc.inputs || [] }), b = Py.run(fixed, { inputs: tc.inputs || [] });
            ok(b.ok, 'исправленный код падает: ' + b.error, errs);
            if (!a.ok || a.output !== b.output) differs = true;
            info.push(JSON.stringify(tc.inputs || []) + ': было ' + JSON.stringify(a.ok ? a.output : a.error) + ' → стало ' + JSON.stringify(b.output));
          }
          ok(differs, 'на тестах баг не проявляется (вывод одинаковый)', errs);
          break;
        }
        case 'maze': {
          ok(d.inputLabels.length === (task.code.match(/input\(\)/g) || []).length, 'число полей не совпадает с числом input()', errs);
          const sigs = new Set();
          for (const sol of d.solutions) {
            const r = Py.run(task.code, { inputs: sol, trace: true });
            const win = r.ok && r.output.includes(d.goal) && !(d.avoid || []).some(a => r.output.includes(a));
            ok(win, 'решение ' + JSON.stringify(sol) + ' не ведёт к цели: ' + JSON.stringify(r.output || r.error), errs);
            if (win) sigs.add(Array.from(new Set(r.trace.map(x => x.line))).sort((a, b) => a - b).join(','));
            info.push(JSON.stringify(sol) + ' → ' + JSON.stringify(r.output));
          }
          ok(sigs.size >= (d.ways || 1), 'решения покрывают ' + sigs.size + ' путей, а заявлено ways = ' + d.ways, errs);
          ok(/👹|💀/.test(task.code), 'нет «плохих» концовок', errs);
          break;
        }
        case 'match': {
          const rights = d.pairs.map(p => p[1]);
          ok(new Set(rights).size === rights.length, 'правые карточки повторяются', errs);
          for (const [l, r] of d.pairs) {
            let got = null;
            if (d.kind === 'range') got = Py.str(Py.evalExpr('list(' + l + ')')).replace(/[\[\],]/g, '').trim();
            else if (d.kind === 'expr') got = Py.str(Py.evalExpr(l, d.vars || {}));
            else if (d.kind === 'filter') {
              const xs = [];
              for (let n = d.from; n <= d.to; n++) if (Py.truthy(Py.evalExpr(l, { n }))) xs.push(n);
              got = xs.join(' ');
            } else if (d.kind === 'code') {
              const res = Py.run(l);
              got = res.ok ? flat(res.output) : 'ОШИБКА ' + res.error;
            }
            if (got !== null) ok(got === r, JSON.stringify(l) + ' даёт «' + got + '», а в паре «' + r + '»', errs);
          }
          break;
        }
      }
    } catch (e) {
      errs.push('исключение: ' + (e.message || e));
    }
    s.items.push({ name: task.id + ' — ' + task.title, ok: !errs.length, detail: errs.concat(info).join('\n') });
  }

  // покрытие: каждая тема — минимум 4 типа пазлов и все 3 уровня
  const cov = section('Покрытие тем (нужно ≥ 4 типов пазлов и все 3 уровня в каждой теме)');
  for (let n = 1; n <= 8; n++) {
    const tt = TASKS.filter(x => x.topic === n);
    const types = new Set(tt.map(x => x.type)), levels = new Set(tt.map(x => x.level));
    cov.items.push({ name: 'Тема ' + n + ': задач ' + tt.length + ', типов ' + types.size + ', уровней ' + levels.size, ok: types.size >= 4 && levels.size === 3 });
  }
}

function render() {
  const onlyFail = document.getElementById('onlyFail').checked;
  const out = document.getElementById('out');
  let total = 0, passed = 0, html = '';
  for (const s of sections) {
    const ok = s.items.filter(i => i.ok).length;
    const hard = s.items.filter(i => !i.soft);
    total += hard.length; passed += hard.filter(i => i.ok).length;
    html += '<h2>' + esc(s.title) + ' — <span class="' + (ok === s.items.length ? 'ok' : hard.every(i => i.ok) ? 'warn' : 'bad') + '">' + ok + '/' + s.items.length + '</span></h2>';
    for (const i of s.items) {
      if (onlyFail && i.ok) continue;
      const cls = i.ok ? 'ok' : i.soft ? 'warn' : 'bad';
      html += '<details' + (i.ok || i.soft ? '' : ' open') + '><summary class="' + cls + '">' + (i.ok ? '✔ ' : i.soft ? '⚠ ' : '✘ ') + esc(i.name) + '</summary>' +
        (i.code ? '<pre>' + esc(i.code) + '</pre>' : '') + (i.detail ? '<pre>' + esc(i.detail) + '</pre>' : '') + '</details>';
    }
  }
  out.innerHTML = html;
  const tot = document.getElementById('total');
  tot.className = 'summary ' + (passed === total ? 'ok' : 'bad');
  tot.textContent = (passed === total ? '✔ Все проверки пройдены: ' : '✘ Пройдено ') + passed + ' из ' + total;
  console.log('[tests] ' + passed + '/' + total);
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

runEngineTests();
for (const c of DATA_CHECKS) c(section);
render();
document.getElementById('onlyFail').addEventListener('change', render);
</script>
